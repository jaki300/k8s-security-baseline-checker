framework: SOC2
version: "Trust Services Criteria 2022"
metadata:
  name: "SOC 2 Trust Services Criteria"
  description: "Security, Availability, Processing Integrity, Confidentiality, and Privacy"
  scoring:
    method: weighted_average
    weighted_by_category: true
    minimum_compliance_score: 85.0
    category_weights:
      "Logical and Physical Access Controls": 1.5
      "System Operations": 1.3
      "Control Environment": 1.0

mappings:
  # CC6.1 maps to multiple access control checks
  - control_id: "CC6.1"
    control_name: "Logical Access Security Software, Infrastructure, and Architecture"
    description: "The entity implements logical access security software, infrastructure, and architectures over protected information assets to protect them from security events."
    category: "Logical and Physical Access Controls"
    check_ids:
      - "cis-1.1.1"  # RBAC wildcard
      - "cis-2.1.1"  # Pods non-root
      - "cis-2.1.2"  # Privileged containers
    weight: 1.5
    mapping_rule:
      pass_status: COMPLIANT
      fail_status: NON_COMPLIANT
      warn_status: PARTIAL
      requires_evidence: true

  # CC6.2 maps to user access controls
  - control_id: "CC6.2"
    control_name: "Prior to Issuing System Credentials and Granting System Access"
    description: "Prior to issuing system credentials and granting system access, the entity registers and authorizes new internal and external users."
    category: "Logical and Physical Access Controls"
    check_ids:
      - "cis-2.1.1"  # Pods non-root
      - "cis-2.2.2"  # Default ServiceAccount
    weight: 1.5
    mapping_rule:
      pass_status: COMPLIANT
      fail_status: NON_COMPLIANT
      warn_status: PARTIAL
      requires_evidence: true

  # CC7.1 maps to system operations
  - control_id: "CC7.1"
    control_name: "System Operations"
    description: "The entity develops and documents procedures for system operations."
    category: "System Operations"
    check_ids:
      - "cis-2.2.1"  # Resource limits
      - "cis-2.2.3"  # Liveness probes
      - "cis-2.2.4"  # Readiness probes
    weight: 1.3
    mapping_rule:
      pass_status: COMPLIANT
      fail_status: NON_COMPLIANT
      warn_status: PARTIAL
      requires_evidence: true

  # CC6.4 maps to access restrictions
  - control_id: "CC6.4"
    control_name: "Access Is Restricted to Authorized Users"
    description: "The entity restricts physical access to facilities and logical access to systems."
    category: "Logical and Physical Access Controls"
    check_ids:
      - "cis-2.1.3"  # HostPath volumes
      - "cis-4.1.1"  # NetworkPolicies
    weight: 1.5
    mapping_rule:
      pass_status: COMPLIANT
      fail_status: NON_COMPLIANT
      warn_status: PARTIAL
      requires_evidence: true
